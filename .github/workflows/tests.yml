name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-core.txt
      - name: Run unit and integration tests
        run: python -m pytest -q
      - name: Verify required numerical operations
        run: python scripts/preflight_accelerator.py --backend cpu
      - name: Run non-paper engineering smoke test
        run: python run_smoke.py --device cpu --steps 5 --points 64
